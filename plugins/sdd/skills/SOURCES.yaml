# Development Discipline (from obra/superpowers — customized, do not sync)
# systematic-debugging: forked from obra/superpowers and since extended well past it —
# the bundled feedback-loop.md reference plus its "build a red-capable loop first" step,
# and Phase 3's 3-5 ranked falsifiable hypotheses (upstream still forms a single
# hypothesis). `frozen` only skipped non-`--all` runs, so a sync could still clobber
# these; `original` is the correct protection.
# Upstream: https://github.com/obra/superpowers → skills/systematic-debugging
systematic-debugging:
  repo: original
  upstream: https://github.com/obra/superpowers
  upstream_path: skills/systematic-debugging
# test-driven-development: forked from obra/superpowers, then extended with the
# Walking Skeleton section (inspired by Integration-First / walking-skeleton practice)
# and the workflow-granted skeleton-group exception. A sync would clobber both, so
# it is `original` now — the upstream path is kept here as a provenance note only.
# Upstream: https://github.com/obra/superpowers → skills/test-driven-development
test-driven-development:
  repo: original
  upstream: https://github.com/obra/superpowers
  upstream_path: skills/test-driven-development
# verification-before-completion: forked from obra/superpowers; local copy keeps the
# "no shortcuts" bottom-line section and the GOOD/BAD wording this repo uses elsewhere.
# Upstream has nothing we lack, so there is nothing to sync — see systematic-debugging.
# Upstream: https://github.com/obra/superpowers → skills/verification-before-completion
verification-before-completion:
