# Skill source tracking
# Maps each bundled skill to its upstream repository and path within that repo.
# This file is for maintenance only — agents do not read it.
# path: relative path to the skill directory containing SKILL.md (from repo root)
#
# repo: original          — maintained here; the normal sync never touches it
# upstream: / upstream_path:  — on an `original` entry, records where it was forked from so
#   `update-skills.sh --drift` can still report what upstream changed since the fork
#   (read-only) and `--snapshot` can reset the baseline in skills/.baselines/<skill>.md.
#   Omit both when the upstream is gone for good — there is nothing left to track.

