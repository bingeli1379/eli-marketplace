  path: skills/postgres-pro

# sqlserver-diagnostics: the DMV query set from vince-winkintel/sql-server-skills (MIT, bundled
# LICENSE kept). `original` because we did NOT adopt it as-is — the upstream skill's index
# maintenance guidance repeats the outdated 10%/30% reorganize-vs-rebuild rule of thumb that
# current Microsoft docs contradict, so the body was rewritten to keep the (durable) DMV queries
# and route every threshold / prescriptive fix to the official docs instead. `upstream:` is kept
# so --drift still surfaces upstream changes worth re-reading.
sqlserver-diagnostics:
  repo: original
  upstream: https://github.com/vince-winkintel/sql-server-skills
  upstream_path: sqlserver-diagnostics

