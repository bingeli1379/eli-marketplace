# postgres-pro: PostgreSQL-specific operational depth (JSONB/GIN, replication, VACUUM/bloat,
# extensions, pg_stat_*) that the portable PG/MySQL tuning skills do not cover. Local
# description narrows the trigger so it does not compete with sql-query-optimization.
